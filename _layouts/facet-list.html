---
layout: default
---
{{ content }}

<div id="facet-list-container" class="facet-list">
  <p class="loading">Loading list…</p>
</div>

<script>
const targetElement = document.querySelector('#facet-list-container p.loading');

if (targetElement && typeof directoryData !== 'undefined') {
  let tocHtml = '<nav class="table-of-contents"><h2>Table of Contents</h2><ul>';
  let contentHtml = '';
  
  let currentSource = null;
  let currentStreet = null;
  let currentCardinality = null;
  let isListOpen = false;

  // Helper function to safely create URL-friendly IDs for anchor links
  const createSlug = (str) => String(str).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

  directoryData.forEach((item, index) => {
    
    // Check if hierarchy changed
    const sourceChanged = item.source !== currentSource;
    const streetChanged = item.street !== currentStreet;
    const cardinalityChanged = item.cardinality !== currentCardinality;

    // If headers change and a <ul> is currently open, close it and add "Back to top"
    if ((sourceChanged || streetChanged || cardinalityChanged) && isListOpen) {
      contentHtml += `</ul><a href="#toc" class="back-to-top">↑ Back to top</a>`;
      isListOpen = false;
    }

    // Output <h1> when 'source' changes
    if (sourceChanged) {
      currentSource = item.source;
      currentStreet = null;
      currentCardinality = null;
      
      const sourceId = `source-${createSlug(currentSource)}`;
      tocHtml += `<li><a href="#${sourceId}">${currentSource}</a></li>`;
      contentHtml += `<h1 id="${sourceId}">${currentSource}</h1>`;
    }

    // Output <h2> when 'street' changes
    if (streetChanged) {
      currentStreet = item.street;
      currentCardinality = null;
      
      const streetId = `street-${createSlug(currentSource)}-${createSlug(currentStreet)}`;
      contentHtml += `<h2 id="${streetId}">${currentStreet}</h2>`;
    }

    // Output <h3> when 'cardinality' changes
    if (cardinalityChanged) {
      currentCardinality = item.cardinality;
      
      const cardId = `card-${createSlug(currentSource)}-${createSlug(currentStreet)}-${createSlug(currentCardinality)}`;
      contentHtml += `<h3 id="${cardId}">${currentCardinality}</h3>`;
    }

    // Open <ul> if not already open
    if (!isListOpen) {
      contentHtml += `<ul>`;
      isListOpen = true;
    }

    // Output listing as an <li> item
    if (item.listing) {
      contentHtml += `<li>${item.listing}</li>`;
    }
  });

  // Close final <ul> and add the last "Back to top" link
  if (isListOpen) {
    contentHtml += `</ul><a href="#toc" class="back-to-top">↑ Back to top</a>`;
  }

  tocHtml += '</ul></nav><hr />';

  // Combine TOC and content, then update the container
  targetElement.id = 'toc'; // Set container ID as anchor target for TOC
  targetElement.innerHTML = tocHtml + contentHtml;
}

</script>
