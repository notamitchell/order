---
layout: default
---
{{ content }}

<div id="facet-list-container" class="facet-list">
  <p class="loading">Loading list…</p>
</div>

<script>
(function(){
  // Which raw "source" value in directoryData corresponds to each facet.
  // Add a new line here whenever a new facet page is introduced.
  const FACET_SOURCE = {
    people: "Electoral roll",
    places: "Directory"
  };

  const facet = "{{ page.facet }}";
  const expectedSource = FACET_SOURCE[facet];
  const container = document.getElementById('facet-list-container');

  if (!expectedSource) {
    container.innerHTML = `<p>This page is missing a valid "facet" value in its front matter.</p>`;
    return;
  }

  const data = (typeof directoryData !== 'undefined') ? directoryData : [];
  const rows = data.filter(d => d.source === expectedSource);

  // Group rows into one entry per distinct person/place, tracking every
  // year that entity shows up so the list doesn't repeat a name per year.
  const grouped = new Map();

  rows.forEach(d => {
    let key, label;
    if (facet === 'people') {
      const surname = d['Surname'] || '';
      const given = d['Given Names'] || '';
      key = `${surname}|${given}`.toLowerCase();
      label = `${given} ${surname}`.trim();
    } else {
      key = `${d.street || ''}|${d.listing || ''}`.toLowerCase();
      label = d.listing || d.street || '';
    }
    if (!key.trim().replace(/\|/g, '')) return;

    if (!grouped.has(key)) {
      grouped.set(key, { label, entityID: d.entityID, years: new Set() });
    }
    if (d.year) grouped.get(key).years.add(d.year);
  });

  const allItems = [...grouped.values()].sort((a, b) => a.label.localeCompare(b.label));

  // --- Simple search + pagination, matching the site's existing conventions ---
  const state = { search: '', page: 1, perPage: 200 };

  function escapeHtml(s){
    return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render(){
    const filtered = state.search
      ? allItems.filter(item => item.label.toLowerCase().includes(state.search))
      : allItems;

    const totalPages = Math.max(1, Math.ceil(filtered.length / state.perPage));
    if (state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * state.perPage;
    const pageItems = filtered.slice(start, start + state.perPage);

    const listHtml = pageItems.length
      ? pageItems.map(item => {
          const years = item.years.size ? ` <span class="facet-years">(${[...item.years].sort().join(', ')})</span>` : '';
          const link = item.entityID ? `civic?id=${encodeURIComponent(item.entityID)}` : null;
          const name = escapeHtml(item.label);
          return `<li>${link ? `<a href="${link}">${name}</a>` : name}${years}</li>`;
        }).join('')
      : '<li class="facet-no-results">No entries match your search.</li>';

    const pagerHtml = totalPages > 1 ? `
      <div class="facet-pagination">
        <button type="button" data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>‹ Prev</button>
        <span>Page ${state.page} of ${totalPages}</span>
        <button type="button" data-page="${state.page + 1}" ${state.page === totalPages ? 'disabled' : ''}>Next ›</button>
      </div>` : '';

    container.innerHTML = `
      <div class="facet-toolbar">
        <input type="text" id="facetSearchInput" placeholder="Search ${facet}…" value="${escapeHtml(state.search)}">
        <span class="facet-count">${filtered.length.toLocaleString()} ${facet}</span>
      </div>
      <ul class="facet-list-items">${listHtml}</ul>
      ${pagerHtml}
    `;

    document.getElementById('facetSearchInput').addEventListener('input', (e) => {
      state.search = e.target.value.trim().toLowerCase();
      state.page = 1;
      render();
    });
    container.querySelectorAll('[data-page]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.page = Number(btn.dataset.page);
        render();
      });
    });
  }

  render();
})();
</script>
