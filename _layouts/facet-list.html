---
layout: default
---
{{ content }}

<div id="facet-list-container" class="facet-list">
  <p class="loading">Loading list…</p>
</div>

<script>
(function(){
  // Which raw "source" value in directoryData corresponds to each facet.
  // Add a new line here whenever a new facet page is introduced.
  const FACET_SOURCE = {
    people: "Electoral roll",
    places: "Directory"
  };

  const facet = "{{ page.facet }}";
  const expectedSource = FACET_SOURCE[facet];
  const container = document.getElementById('facet-list-container');

 // 1. Select the <p class="loading"> element
const targetElement = document.querySelector('#facet-list-container p.loading');

if (targetElement && typeof directoryData !== 'undefined') {
  let htmlBuilder = '';
  
  // Track previous hierarchy values to determine when to print new headers
  let currentSource = null;
  let currentStreet = null;
  let currentCardinality = null;

  // Loop through the dataset in array order
  directoryData.forEach(item => {
    
    // Output <h1> when 'source' changes
    if (item.source !== currentSource) {
      currentSource = item.source;
      currentStreet = null;      // Reset child headers on parent change
      currentCardinality = null;
      htmlBuilder += `<h1>${currentSource}</h1>`;
    }

    // Output <h2> when 'street' changes
    if (item.street !== currentStreet) {
      currentStreet = item.street;
      currentCardinality = null; // Reset child headers on parent change
      htmlBuilder += `<h2>${currentStreet}</h2>`;
    }

    // Output <h3> when 'cardinality' changes
    if (item.cardinality !== currentCardinality) {
      currentCardinality = item.cardinality;
      htmlBuilder += `<h3>${currentCardinality}</h3>`;
    }

    // Output the listing entry
    if (item.listing) {
      htmlBuilder += `<div class="listing">${item.listing}</div>`;
    }
  });

  // 2. Set the HTML content of the <p> element
  targetElement.innerHTML = htmlBuilder;
}
})();
</script>
