---
layout: default
---
{{ content }}

<div id="facet-list-container" class="facet-list">
  <p class="loading">Loading list…</p>
</div>

<script>
(function(){
  // Which raw "source" value in directoryData corresponds to each facet.
  // Add a new line here whenever a new facet page is introduced.
  const FACET_SOURCE = {
    people: "Electoral roll",
    places: "Directory"
  };

  const facet = "{{ page.facet }}";
  const expectedSource = FACET_SOURCE[facet];
  const container = document.getElementById('facet-list-container');

  if (!expectedSource) {
    container.innerHTML = `<p>This page is missing a valid "facet" value in its front matter.</p>`;
    return;
  }

  const data = (typeof directoryData !== 'undefined') ? directoryData : [];
  const rows = data.filter(d => d.source === expectedSource);

  // Fixed compass order; anything else (blank, unusual values) sorts after, alphabetically.
  const CARDINALITY_ORDER = ['North', 'East', 'South', 'West'];
  function cardinalityRank(c){
    const i = CARDINALITY_ORDER.indexOf(c);
    return i === -1 ? CARDINALITY_ORDER.length : i;
  }

  function escapeHtml(s){
    return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function slugify(s){
    return (s || 'unknown').toString().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  // Build a Year -> Street -> Cardinality -> [rows] tree
  const tree = new Map();
  rows.forEach(d => {
    const year = d.year || 'Unknown year';
    const street = d.street || 'Unknown street';
    const card = d.cardinality || 'Unspecified';

    if (!tree.has(year)) tree.set(year, new Map());
    const streets = tree.get(year);
    if (!streets.has(street)) streets.set(street, new Map());
    const cards = streets.get(street);
    if (!cards.has(card)) cards.set(card, []);
    cards.get(card).push(d);
  });

  const years = [...tree.keys()].sort((a, b) => {
    if (a === 'Unknown year') return 1;
    if (b === 'Unknown year') return -1;
    return a - b;
  });

  if (years.length === 0) {
    container.innerHTML = '<p>No entries found.</p>';
    return;
  }

  // Table of contents: one link per year
  let tocHtml = '<nav class="facet-toc"><p>' +
    years.map(y => `<a href="#year-${slugify(y)}">${escapeHtml(y)}</a>`).join(' | ') +
    '</p></nav>';

  let bodyHtml = '';
  years.forEach(year => {
    bodyHtml += `<h1 id="year-${slugify(year)}">${escapeHtml(year)}</h1>`;

    const streets = [...tree.get(year).keys()].sort((a, b) => a.localeCompare(b));
    streets.forEach(street => {
      bodyHtml += `<h2>${escapeHtml(street)}</h2>`;

      const cards = [...tree.get(year).get(street).keys()]
        .sort((a, b) => cardinalityRank(a) - cardinalityRank(b));
      cards.forEach(card => {
        bodyHtml += `<h3>${escapeHtml(card)}</h3><ul class="facet-list-items">`;
        tree.get(year).get(street).get(card).forEach(d => {
          const label = escapeHtml(d.listing || street);
          const link = d.entityID ? `civic?id=${encodeURIComponent(d.entityID)}` : null;
          bodyHtml += `<li>${link ? `<a href="${link}">${label}</a>` : label}</li>`;
        });
        bodyHtml += '</ul>';
      });
    });
  });

  container.innerHTML = tocHtml + bodyHtml;
})();
</script>
