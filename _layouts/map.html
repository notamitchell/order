<script>
// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════

];


// ═══════════════════════════════════════════════════════════
//  CONSTANTS — derived from data
// ═══════════════════════════════════════════════════════════
const YEARS = [...new Set(directoryData.map(e => e.year))].sort((a,b) => a - b);

// Interpolate a colour for each year across a fixed palette:
// oldest → warm amber, stepping through teal/violet/green → newest cool blue.
// Works for any number of years automatically.
(function() {
    const palette = [
        [181,  69, 27],  // warm rust
        [184, 134, 11],  // amber
        [46, 125, 94],   // teal green
        [123, 94, 167],  // violet
        [42, 100, 160],  // steel blue
    ];
    function lerp(a, b, t) { return a + (b - a) * t; }
    function toHex(r,g,b) {
        return '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
    }
    window.YEAR_COLORS = {};
    YEARS.forEach((year, i) => {
        const t   = YEARS.length === 1 ? 0 : i / (YEARS.length - 1);
        const raw = t * (palette.length - 1);
        const lo  = Math.floor(raw), hi = Math.min(lo + 1, palette.length - 1);
        const f   = raw - lo;
        const r   = lerp(palette[lo][0], palette[hi][0], f);
        const g   = lerp(palette[lo][1], palette[hi][1], f);
        const b   = lerp(palette[lo][2], palette[hi][2], f);
        YEAR_COLORS[year] = toHex(r, g, b);
    });
})();
const MAX_ARC_OFFSET  = 0.00072; // constant outer bound (degrees lat)

// ═══════════════════════════════════════════════════════════
//  MAP INIT
// ═══════════════════════════════════════════════════════════
const map = L.map('map', { center:[-37.8009,144.9622], zoom:18, minZoom:2, maxZoom:20 });



// ═══════════════════════════════════════════════════════════
//  ARC GEOMETRY
// ═══════════════════════════════════════════════════════════
function bezier(A, ctrl, B, t) {
    const u = 1 - t;
    return { lat: u*u*A.lat + 2*u*t*ctrl.lat + t*t*B.lat,
             lng: u*u*A.lng + 2*u*t*ctrl.lng + t*t*B.lng };
}

/**
 * Compute arc positions for one year+side chain.
 * arcOffset: positive = north/east, negative = south/west. Magnitude sets bow amount.
 *
 * For tail/head segments (one open end), we project a ghost anchor
 * in the STREET direction (east/west) while preserving the correct
 * lateral offset so the arc always bows the right way.
 */
/**
 * Apply arcOffset to the correct geographic axis:
 *   - North/South sides: offset perpendicular to an east-west street → nudge latitude
 *   - East/West sides:   offset perpendicular to a north-south street → nudge longitude
 * Returns { lat, lng } with the bow applied.
 */
function applyOffset(midLat, midLng, arcOffset, side) {
    if (side === 'East' || side === 'West') {
        return { lat: midLat, lng: midLng + arcOffset };
    }
    return { lat: midLat + arcOffset, lng: midLng };
}

function computeChain(entries, arcOffset, side) {
    const r = entries.map(e => ({ ...e }));
    const n = r.length;

    // Identify anchor indices
    const anchors = r.map((e,i) => e.lat != null ? i : -1).filter(i => i >= 0);

    // ── Anchored segments between consecutive anchors ──
    for (let ai = 0; ai < anchors.length - 1; ai++) {
        const si = anchors[ai], ei = anchors[ai+1];
        const A  = { lat:r[si].lat, lng:r[si].lng };
        const B  = { lat:r[ei].lat, lng:r[ei].lng };
        const ctrl = applyOffset((A.lat+B.lat)/2, (A.lng+B.lng)/2, arcOffset, side);
        const steps = ei - si;
        for (let k = 1; k < steps; k++) {
            const p = bezier(A, ctrl, B, k/steps);
            r[si+k].lat = p.lat; r[si+k].lng = p.lng; r[si+k]._computed = true;
        }
    }

    // ── Tail: entries after last anchor ──
    if (anchors.length > 0) {
        const lastAi = anchors[anchors.length - 1];
        const tailCount = n - lastAi - 1;
        if (tailCount > 0) {
            const A = { lat:r[lastAi].lat, lng:r[lastAi].lng };
            // Street direction: from second-to-last anchor to last, or infer from side
            // N/S sides run east-west → default forward direction is east (+lng)
            // E/W sides run north-south → default forward direction is north (-lat, i.e. decreasing lat)
            let dLng = 0, dLat = 0;
            if (anchors.length >= 2) {
                const prev = anchors[anchors.length - 2];
                const rawLat = A.lat - r[prev].lat;
                const rawLng = A.lng - r[prev].lng;
                const len = Math.sqrt(rawLat*rawLat + rawLng*rawLng) || 1;
                dLat = (rawLat/len) * 0.00014;
                dLng = (rawLng/len) * 0.00014;
            } else {
                // fallback defaults based on street orientation
                if (side === 'East' || side === 'West') { dLat = -0.00014; } // north-south street → project northward
                else                                    { dLng =  0.00014; } // east-west street  → project eastward
            }
            const ghost = { lat: A.lat + dLat*(tailCount+1), lng: A.lng + dLng*(tailCount+1) };
            const ctrl  = applyOffset((A.lat+ghost.lat)/2, (A.lng+ghost.lng)/2, arcOffset, side);
            for (let k = 1; k <= tailCount; k++) {
                const p = bezier(A, ctrl, ghost, k/(tailCount+1));
                r[lastAi+k].lat = p.lat; r[lastAi+k].lng = p.lng; r[lastAi+k]._computed = true;
            }
        }
    }

    // ── Head: entries before first anchor ──
    if (anchors.length > 0) {
        const firstAi = anchors[0];
        if (firstAi > 0) {
            const A = { lat:r[firstAi].lat, lng:r[firstAi].lng };
            let dLng = 0, dLat = 0;
            if (anchors.length >= 2) {
                const next = anchors[1];
                const rawLat = r[next].lat - A.lat;
                const rawLng = r[next].lng - A.lng;
                const len = Math.sqrt(rawLat*rawLat + rawLng*rawLng) || 1;
                dLat = -(rawLat/len) * 0.00014;
                dLng = -(rawLng/len) * 0.00014;
            } else {
                if (side === 'East' || side === 'West') { dLat =  0.00014; } // project southward (back)
                else                                    { dLng = -0.00014; } // project westward (back)
            }
            const ghost = { lat: A.lat + dLat*(firstAi+1), lng: A.lng + dLng*(firstAi+1) };
            const ctrl  = applyOffset((ghost.lat+A.lat)/2, (ghost.lng+A.lng)/2, arcOffset, side);
            for (let k = 0; k < firstAi; k++) {
                const t = (firstAi - k) / (firstAi + 1);
                const p = bezier(ghost, ctrl, A, t);
                r[k].lat = p.lat; r[k].lng = p.lng; r[k]._computed = true;
            }
        }
    }

    return r;
}


// All unique {year, street, side} combinations present in the data
const CHAINS = [];
{
    const seen = new Set();
    directoryData.forEach(e => {
        const k = `${e.year}|${e.street}|${e.cardinality}`;
        if (!seen.has(k)) { seen.add(k); CHAINS.push({ year:e.year, street:e.street, side:e.cardinality }); }
    });
}

// Raw template entries per year+street+side (immutable originals)
const rawChains = {};
CHAINS.forEach(({ year, street, side }) => {
    rawChains[`${year}-${street}-${side}`] = directoryData.filter(
        e => e.year === year && e.street === street && e.cardinality === side
    ).map(e => ({ ...e }));
});


const activeYears = new Set([YEARS[YEARS.length - 1]]); // Latest year on by default

// Compute arc offset for a year given the current active set.
// For North/East: positive offset (bows north / east away from street centreline).
// For South/West: negative offset (bows south / west away from street centreline).
// The sign is applied to lat (North/South) or lng (East/West) by applyOffset().
//
// Ranking is done ONLY among active years that share the same street+side group.
// Years on different streets are independent and must not shift each other's offsets.
function arcOffsetForYear(year, street, side) {
    const sideSign = (side === 'North' || side === 'East') ? 1 : -1;

    // Active peers: years that have a chain for this exact street+side
    const peers = [...activeYears].filter(y =>
        (rawChains[`${y}-${street}-${side}`] || []).length > 0
    ).sort((a, b) => b - a); // newest first

    const N    = peers.length;
    const rank = peers.indexOf(year);
    if (rank < 0) return 0;

    // rank 0 → smallest offset, rank N-1 → MAX_ARC_OFFSET
    const magnitude = N === 1 ? MAX_ARC_OFFSET * 0.15 : MAX_ARC_OFFSET * (rank + 1) / N;
    return magnitude * sideSign;
}

// ── Leaflet layer objects ──
const markerLayers = {}; // `${year}-${street}-${side}-${idx}` → L.Marker
const polyLayers   = {}; // `${year}-${street}-${side}` → L.Polyline
const yearGroups   = {}; // year → L.LayerGroup (holds markers + polylines for that year)

YEARS.forEach(year => { yearGroups[year] = L.layerGroup(); });
CHAINS.forEach(({ year, street, side }) => {
    const key = `${year}-${street}-${side}`;
    // Placeholder polyline (empty)
    const poly = L.polyline([], { color:YEAR_COLORS[year], weight:1.5, opacity:0.85 })
        .bindTooltip(`${year} · ${street}`, { sticky:true, direction:'top' });
    polyLayers[key] = poly;
    poly.addTo(yearGroups[year]);

    // Markers — created once for every entry; positions set by initPositions
    rawChains[key].forEach((entry, idx) => {
        const mk = L.marker([0,0], { icon: makeIcon(entry, YEAR_COLORS[year]) });
        mk.bindTooltip(entry.listing, { direction:'top', offset:[0,-4] });
        mk.on('click', () => openModal(entry));
        markerLayers[`${key}-${idx}`] = mk;
        mk.addTo(yearGroups[year]);
    });
});

// Cross-year layer (rebuilt on toggle)
let crossYearLayer = L.layerGroup().addTo(map);
const crossYearById = {};

// ═══════════════════════════════════════════════════════════
//  ICON FACTORY
// ═══════════════════════════════════════════════════════════
function makeIcon(entry, color) {
    const t         = entry.type;
    const uncertain = !!entry._computed;
    let html, size;

    // Helper to convert hex colors to an RGBA value for semi-transparent fills if needed
    const getAlphaColor = (hex, alpha) => {
        if(hex.startsWith('#') && hex.length === 7) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        return hex;
    };

    if (t === 'Intersection') {
        const cls = uncertain ? 'marker-uncertain-cross' : '';
        // Changed background from a flat color modifier to use semi-transparent RGBA color instead of master opacity
        const fillColor = uncertain ? getAlphaColor(color, 0.6) : color;
        html = `<div class="${cls}" style="position:relative;width:22px;height:22px;">
            <div style="position:absolute;top:8px;left:0;width:22px;height:6px;background:${fillColor};border-radius:1px;"></div>
            <div style="position:absolute;left:8px;top:0;width:6px;height:22px;background:${fillColor};border-radius:1px;"></div>
        </div>`;
        size = [22,22];
    } else if (t === 'Right-of-way') {
        const cls = uncertain ? 'marker-uncertain-cross' : '';
        const borderColor = uncertain ? getAlphaColor(color, 0.6) : color;
        html = `<div class="${cls}" style="position:relative;width:11px;height:11px;">
            <div style="position:absolute;top:4px;left:0;width:11px;height:3px;border:1.5px solid ${borderColor};border-radius:1px;box-sizing:border-box;"></div>
            <div style="position:absolute;left:4px;top:0;width:3px;height:11px;border:1.5px solid ${borderColor};border-radius:1px;box-sizing:border-box;"></div>
        </div>`;
        size = [11,11];
    } else {
        const cls = uncertain ? 'marker-uncertain' : '';
        // The shadow effect handles its own alpha values independently, keeping the main circle 100% solid
        const shadow = uncertain
            ? `box-shadow:0 0 5px 2px ${color}55, 0 0 2px rgba(0,0,0,0.3);`
            : `box-shadow:0 0 2px rgba(0,0,0,0.4);`;
        html = `<div class="${cls}" style="width:6px;height:6px;border-radius:50%;background:${color};border:1px solid rgba(255,255,255,0.65);${shadow}"></div>`;
        size = [6,6];
    }
    return L.divIcon({ html, className:'', iconSize:size, iconAnchor:[size[0]/2,size[1]/2] });
}

// ═══════════════════════════════════════════════════════════
//  POSITIONED CHAIN CACHE
//  We store the current "from" positions and animate to "to".
// ═══════════════════════════════════════════════════════════
const currentPos = {}; // `${year}-${street}-${side}-${idx}` → { lat, lng }

function getTargetPositions(year, street, side) {
    const offset = arcOffsetForYear(year, street, side);
    return computeChain(rawChains[`${year}-${street}-${side}`], offset, side);
}

// Initialise positions for all chains
function initPositions() {
    CHAINS.forEach(({ year, street, side }) => {
        const key     = `${year}-${street}-${side}`;
        const targets = getTargetPositions(year, street, side);
        targets.forEach((e, idx) => {
            if (e.lat == null) return;
            currentPos[`${key}-${idx}`] = { lat: e.lat, lng: e.lng };
            // Propagate _computed flag so makeIcon can style uncertain markers
            rawChains[key][idx]._computed = !!e._computed;
        });
    });
    applyPositionsToMap();
}

function applyPositionsToMap() {
    CHAINS.forEach(({ year, street, side }) => {
        const key   = `${year}-${street}-${side}`;
        const pts   = [];
        rawChains[key].forEach((entry, idx) => {
            const pos = currentPos[`${key}-${idx}`];
            if (!pos) return;
            const mk = markerLayers[`${key}-${idx}`];
            if (mk) {
                mk.setLatLng([pos.lat, pos.lng]);
                // Refresh icon so uncertainty class reflects current _computed state
                mk.setIcon(makeIcon(entry, YEAR_COLORS[year]));
            }
            pts.push([pos.lat, pos.lng]);
        });
        polyLayers[key].setLatLngs(pts);
    });
}

// ═══════════════════════════════════════════════════════════
//  POSITION UPDATE  (instant — no movement animation)
// ═══════════════════════════════════════════════════════════
function recomputePositions() {
    CHAINS.filter(c => activeYears.has(c.year)).forEach(({ year, street, side }) => {
        const key     = `${year}-${street}-${side}`;
        const targets = getTargetPositions(year, street, side);
        targets.forEach((e, idx) => {
            if (e.lat == null) return;
            currentPos[`${key}-${idx}`] = { lat: e.lat, lng: e.lng };
            rawChains[key][idx]._computed = e._computed;
        });
    });
    applyPositionsToMap();
    rebuildCrossYearLines();
}

// ═══════════════════════════════════════════════════════════
//  CROSS-YEAR LINES
// ═══════════════════════════════════════════════════════════
// Build index using string-type entityIDs as cross-year link identifiers
CHAINS.forEach(({ year, street, side }) => {
    rawChains[`${year}-${street}-${side}`].forEach((e, idx) => {
        // Cross-year links are identified when entityID is a string
        if (typeof e.entityID !== 'string') return;
        
        if (!crossYearById[e.entityID]) crossYearById[e.entityID] = [];
        crossYearById[e.entityID].push({ year, street, side, idx });
    });
});
Object.values(crossYearById).forEach(g => g.sort((a,b) => a.year - b.year));

function rebuildCrossYearLines() {
    crossYearLayer.clearLayers();
    Object.values(crossYearById).forEach(group => {
        for (let i = 0; i < group.length - 1; i++) {
            const a = group[i], b = group[i+1];
            if (!activeYears.has(a.year) || !activeYears.has(b.year)) continue;
            const posA = currentPos[`${a.year}-${a.street}-${a.side}-${a.idx}`];
            const posB = currentPos[`${b.year}-${b.street}-${b.side}-${b.idx}`];
            if (!posA || !posB) continue;
            L.polyline([[posA.lat,posA.lng],[posB.lat,posB.lng]],
                { color:'#222', weight:3.5, opacity:0.55, dashArray:'6,5' }).addTo(crossYearLayer);
            L.polyline([[posA.lat,posA.lng],[posB.lat,posB.lng]],
                { color:'#fff', weight:1.5, opacity:0.9,  dashArray:'6,5' }).addTo(crossYearLayer);
        }
    });
}

// ═══════════════════════════════════════════════════════════
//  GEOJSON LAYER — UoM Land Use
// ═══════════════════════════════════════════════════════════

// Style function for GeoJSON features
function getUoMStyle(feature) {
    return {
        fillColor: '#3388ff',
        weight: 2,
        opacity: 0.8,
        color: '#0066cc',
        fillOpacity: 0.3
    };
}

// Popup content for each feature
function onEachFeature(feature, layer) {
    const props = feature.properties;
    let popupContent = `<strong>${props.building_name || 'Property'}</strong><br>`;
    popupContent += `Address: ${props.street_address || 'N/A'}<br>`;
    popupContent += `Suburb: ${props.SUBURB || 'N/A'}<br>`;
    popupContent += `Status: ${props.UOM_STATUS || 'N/A'}<br>`;
    popupContent += `Area: ${props.PROPERTY_TITLE_LAND_AREA || 'N/A'} m²`;
    
    layer.bindPopup(popupContent);
    layer.bindTooltip(props.building_name || props.street_address || 'Property', { sticky: true });
}

// Create GeoJSON layer
const uomLanduseLayer = L.geoJSON(uomLanduseData, {
    style: getUoMStyle,
    onEachFeature: onEachFeature
});

// Add hover effects
uomLanduseLayer.on('mouseover', function(e) {
    e.layer.setStyle({
        fillOpacity: 0.7,
        weight: 3
    });
});

uomLanduseLayer.on('mouseout', function(e) {
    uomLanduseLayer.resetStyle(e.layer);
});

// Add to a layer group for control panel visibility
const uomLayerGroup = L.layerGroup([uomLanduseLayer]);

// ═══════════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════════
const modal    = document.getElementById('details-modal');
const mHeading = document.getElementById('modal-heading');
const mMeta    = document.getElementById('modal-meta');
const mBody    = document.getElementById('modal-body');
const mLink    = document.getElementById('modal-link');
const mCoords  = document.getElementById('modal-coords');
document.getElementById('close-modal-btn').onclick = () => modal.style.display = 'none';
window.onclick = e => { if (e.target === modal) modal.style.display = 'none'; };

function openModal(entry) {
    mHeading.innerText = entry.listing;

    // 1. Build the metadata bar cleanly without 'undefined'
    const metaParts = [];
    
    if (entry.year) metaParts.push(entry.year);
    if (entry.source) metaParts.push(entry.source);
    if (entry.street) metaParts.push(entry.street);
    if (entry.cardinality) metaParts.push(`${entry.cardinality} side`);
    if (entry.pages) metaParts.push(`p. ${entry.pages}`);

    mMeta.innerText = metaParts.join('  ·  ');

    // 2. Dynamically build mBody content based on source-specific fields
    let bodyHtml = entry.htmlContent || '';

    if (entry.source === 'Electoral roll') {
        const details = [];
        if (entry['Surname'] || entry['Given Names']) {
            details.push(`<strong>Name:</strong> ${entry['Given Names'] || ''} ${entry['Surname'] || ''}`);
        }
        if (entry['Occupation']) details.push(`<strong>Occupation:</strong> ${entry['Occupation']}`);
        if (entry['Gender']) details.push(`<strong>Gender:</strong> ${entry['Gender']}`);
        if (entry['Address']) details.push(`<strong>Address:</strong> ${entry['Address']}`);
        if (entry['Registration Number']) details.push(`<strong>Reg #:</strong> ${entry['Registration Number']}`);

        if (details.length > 0) {
            bodyHtml += `<div class="electoral-details">${details.join('<br>')}</div>`;
        }
    } else if (entry.source === 'directory') {
        if (entry.type) {
            bodyHtml += `<p><strong>Type:</strong> ${entry.type}</p>`;
        }
    }

    mBody.innerHTML = bodyHtml;

    // 3. Link construction
    const primaryKey = `${entry.entityID}`;
    mLink.innerHTML  = `<p><a href="civic?id=${primaryKey}">More Information ...</a></p>`;

    // 4. Coordinates handling
    const key = `${entry.year}-${entry.street}-${entry.cardinality}`;
    const idx = rawChains[key] ? rawChains[key].indexOf(entry) : -1;
    const pos = idx >= 0 ? currentPos[`${key}-${idx}`] : null;

    // Direct lat/lng on entry fallback if pos from currentPos isn't set
    const lat = pos ? pos.lat : entry.lat;
    const lng = pos ? pos.lng : entry.lng;

       if (lat !== undefined && lng !== undefined) {
        mCoords.innerText = `${Number(lat).toFixed(7)}, ${Number(lng).toFixed(7)}${entry._computed ? ' (estimated)' : ''}`;
    } else {
        mCoords.innerText = 'Unknown';
    }

    modal.style.display = 'flex';
}

// ═══════════════════════════════════════════════════════════
//  CONTROL PANEL
// ═══════════════════════════════════════════════════════════
function getTileUrl(source, id) {
    return source === 'vic'
        ? `https://mapwarper.prov.vic.gov.au/maps/tile/${id}/{z}/{x}/{y}.png`
        : `https://mapwarper.net/maps/tile/${id}/{z}/{x}/{y}.png`;
}

// Build a lookup for each year's source type(s)
const YEAR_SOURCES = {};
YEARS.forEach(year => {
    const sourcesForYear = [...new Set(
        directoryData
            .filter(e => e.year === year && e.source)
            .map(e => e.source)
    )];
    // Formats as "Electoral roll", "directory", or "directory, Electoral roll" if a year has both
    YEAR_SOURCES[year] = sourcesForYear.join(', ');
});


const CustomControl = L.Control.extend({
    options: { position:'topright' },
    onAdd() {
        const container = L.DomUtil.create('div', 'leaflet-control-layers');
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        const homeLink = L.DomUtil.create('a', 'control-home-link', container);
        homeLink.href = '/order'; homeLink.innerText = '← Home';

        const yearTitle = L.DomUtil.create('div', 'panel-section-title', container);
        yearTitle.innerText = 'Years';

        YEARS.slice().reverse().forEach(year => {
            const row = L.DomUtil.create('label', 'year-row', container);
            const cb  = L.DomUtil.create('input', '', row);
            cb.type = 'checkbox'; cb.checked = (year === YEARS[YEARS.length - 1]);
            const swatch = L.DomUtil.create('span', 'year-swatch', row);
            swatch.style.background = YEAR_COLORS[year];
            const sourceInfo = YEAR_SOURCES[year] ? ` (${YEAR_SOURCES[year]})` : '';
            row.appendChild(document.createTextNode(`${year}${sourceInfo}`));

            L.DomEvent.on(cb, 'change', () => {
                if (cb.checked) {
                    activeYears.add(year);
                    yearGroups[year].addTo(map);
                } else {
                    activeYears.delete(year);
                    map.removeLayer(yearGroups[year]);
                }
                recomputePositions();
            });
        });

        const mapTitle = L.DomUtil.create('div', 'panel-section-title', container);
        mapTitle.innerText = 'Historic Map Layers';

        mapConfig.forEach(config => {
            const row  = L.DomUtil.create('div', 'layer-control-row', container);
            const lbl  = L.DomUtil.create('label', 'layer-label-container', row);
            const cb   = L.DomUtil.create('input', '', lbl); cb.type = 'checkbox'; cb.checked = config.visibleByDefault;
            const span = L.DomUtil.create('span', '', lbl); span.innerHTML = config.label;
            const sc   = L.DomUtil.create('div', 'slider-container', row);
            sc.innerHTML = '<span>0%</span>';
            const sl   = L.DomUtil.create('input', 'opacity-slider', sc);
            sl.type = 'range'; sl.min = 0; sl.max = 100; sl.value = 100;
            sc.insertAdjacentHTML('beforeend', '<span>100%</span>');
            const layer = L.tileLayer(getTileUrl(config.source, config.id), { maxZoom:20, maxNativeZoom:19, opacity:1 });
            if (config.visibleByDefault) layer.addTo(map);
            L.DomEvent.on(cb, 'change', () => cb.checked ? layer.addTo(map) : map.removeLayer(layer));
            L.DomEvent.on(sl, 'input',  () => layer.setOpacity(sl.value/100));
        });

        const geoJsonTitle = L.DomUtil.create('div', 'panel-section-title', container);
        geoJsonTitle.innerText = 'University of Melbourne';

        const geoJsonRow = L.DomUtil.create('label', 'layer-control-row', container);
        const geoJsonCb = L.DomUtil.create('input', '', geoJsonRow);
        geoJsonCb.type = 'checkbox';
        geoJsonCb.checked = true;

        const geoJsonSpan = L.DomUtil.create('span', '', geoJsonRow);
        geoJsonSpan.innerHTML = 'University of Melbourne properties (<a href="https://spatialdata-uom.opendata.arcgis.com/datasets/UOM::uom-land-parcels-parkville/about">2026</a>)';

        L.DomEvent.on(geoJsonCb, 'change', () => {
            if (geoJsonCb.checked) {
                uomLayerGroup.addTo(map);
            } else {
                map.removeLayer(uomLayerGroup);
            }
        });

        return container;
    }
});
map.addControl(new CustomControl());

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════
initPositions();
yearGroups[YEARS[YEARS.length - 1]].addTo(map); // Latest year visible by default
rebuildCrossYearLines();
uomLayerGroup.addTo(map); // Add UoM GeoJSON layer to map by default
</script>
</body>
</html>
